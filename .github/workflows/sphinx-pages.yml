name: Build & Deploy Docs (Sphinx) Page

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - '.github/workflows/sphinx-pages.yml'
      - 'scripts/**'
      - '01_*/**'
      - '02_*/**'
      - '03_*/**'
      - '04_*/**'
      - '05_*/**'
      - '06_*/**'
      - '07_*/**'
      - '08_*/**'
      - '09_*/**'
      - '10_*/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node (for extract scripts if used)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system deps (doxygen/graphviz) — optional
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Install Python deps (Sphinx + theme + ablog + extras)
        run: |
          set -e
          python -m pip install --upgrade pip
          if [ -f docs/requirements.txt ]; then
            pip install -r docs/requirements.txt
          else
            pip install \
              sphinx==7.4.7 \
              myst-parser>=4.0.1 \
              pydata-sphinx-theme>=0.16.1 \
              sphinx-copybutton>=0.5.2 \
              sphinx-design>=0.6.0 \
              sphinx-sitemap>=2.6.0 \
              linkify-it-py>=2.0.2 \
              sphinxext-opengraph>=0.9.1 \
              sphinx-favicon>=1.0.1 \
              sphinxcontrib-mermaid>=0.9.2 \
              sphinx-codeautolink>=0.15.0 \
              sphinx-hoverxref>=1.4.2,<1.5 \
              ablog
          fi

      # (opcjonalnie) wygenerowanie C++ API przez Doxygen — nie blokuje buildu
      - name: Generate C++ XML (Doxygen)
        run: |
          set -euxo pipefail
          cat > Doxyfile.ci << 'EOF'
          PROJECT_NAME           = OTCv8 CI
          OUTPUT_DIRECTORY       = .doxygen
          GENERATE_XML           = YES
          XML_OUTPUT             = xml
          GENERATE_HTML          = NO
          QUIET                  = YES
          EXTRACT_ALL            = YES
          RECURSIVE              = YES
          FILE_PATTERNS          = *.h *.hpp *.hh *.hxx *.c *.cc *.cpp
          INPUT                  = src
          WARN_IF_UNDOCUMENTED   = NO
          WARNINGS               = YES
          WARN_LOGFILE           = .doxygen/doxygen-warnings.log
          EOF
          rm -rf .doxygen || true
          mkdir -p .doxygen
          doxygen Doxyfile.ci || echo "::warning ::Doxygen returned non-zero; continuing"
          test -f .doxygen/xml/index.xml || echo "::warning ::No .doxygen/xml/index.xml; skipping XML→MD steps"

      # (opcjonalnie) Twój parser API – nie blokuje buildu, jeśli coś pójdzie nie tak
      - name: Run extract-api script (if present)
        run: |
          set -e
          if [ -f scripts/extract-api.mjs ]; then
            node scripts/extract-api.mjs || echo "::warning ::extract-api.mjs failed; continuing"
          fi

      - name: Clean Sphinx cache
        run: rm -rf docs/_build

      # === IMPORT ARTYFAKTÓW AGENTA + GENERACJA STRON AUTHORING ===
      - name: Import authoring artifacts into docs
        run: |
          set -euxo pipefail
          mkdir -p docs/authoring/_imported
          for d in 01_core 01_runtime 02_events 03_modules 04_ui 05_events 05_network 06_assets 07_settings_crypto 08_audio 09_logging 10_game_runtime; do
            if [ -d "$d" ]; then
              mkdir -p "docs/authoring/_imported/$d"
              rsync -a "$d"/ "docs/authoring/_imported/$d"/
            fi
          done

      - name: Auto-generate authoring index pages (datasets/diagrams)
        run: |
          python - << 'PY'
          import os, pathlib

          DOCS = pathlib.Path("docs")
          IMPORTED = DOCS / "authoring" / "_imported"
          chapters = [
              "01_core","01_runtime","02_events","03_modules","04_ui",
              "05_events","05_network","06_assets","07_settings_crypto",
              "08_audio","09_logging","10_game_runtime"
          ]
          def md_escape(s): return s.replace("|","\\|")
          def rel(p): return str(p).replace("\\","/")

          for ch in chapters:
              ch_out = DOCS / "authoring" / ch
              ch_in  = IMPORTED / ch
              ch_out.mkdir(parents=True, exist_ok=True)

              datasets_dir = ch_in / "datasets"
              diagrams_dir = ch_in / "diagrams"

              # index.md
              idx = [
                f"---\ntitle: {ch} — Authoring\n---\n",
                f"# {ch} — Authoring\n",
                "::: {admonition} Co w tym rozdziale?\n:class: tip\n- **Datasets** (CSV/JSON/…)\n- **Diagrams** (PNG/SVG/Mermaid/…)\n- **Index (źródła)** — struktura surowych plików\n:::\n",
                "::: {grid} 1 1 2 2\n:gutter: 2\n",
                "::: {grid-item-card} Datasets\n:link: datasets\n:link-type: doc\n:shadow: md\nPodgląd i lista plików danych.\n:::\n",
                "::: {grid-item-card} Diagrams\n:link: diagrams\n:link-type: doc\n:shadow: md\nPodgląd wykresów/obrazów.\n:::\n",
                "::: {grid-item-card} Index (surowe pliki)\n:link: index-sources\n:link-type: doc\n:shadow: md\nSpis plików skopiowanych do dokumentacji.\n:::\n",
                "::: \n"
              ]
              (ch_out/"index.md").write_text("".join(idx), encoding="utf-8")

              # index-sources.md
              src = [f"# {ch} — Source Index\n"]
              if ch_in.exists():
                  for sub in ["datasets","diagrams","api","cpp","lua"]:
                      p = ch_in / sub
                      if not p.exists(): continue
                      src.append(f"## {sub}\n")
                      for root, _, files in os.walk(p):
                          rootp = pathlib.Path(root)
                          for f in sorted(files):
                              fp = rootp / f
                              web = pathlib.Path('authoring') / "_imported" / ch / fp.relative_to(ch_in)
                              src.append(f"- [{md_escape(str(fp.relative_to(ch_in)))}](/{rel(web)})")
                      src.append("\n")
              else:
                  src.append("_Brak zaimportowanych plików dla tego rozdziału._\n")
              (ch_out/"index-sources.md").write_text("\n".join(src), encoding="utf-8")

              # datasets.md
              dmd = [f"# {ch} — Datasets\n"]
              if datasets_dir.exists():
                  files = []
                  for ext in ["*.csv","*.json","*.ndjson","*.parquet","*.tsv"]:
                      files.extend(datasets_dir.rglob(ext))
                  if files:
                      dmd.append("Lista wykrytych plików danych:\n")
                      for fp in sorted(files):
                          web = pathlib.Path('authoring') / "_imported" / ch / fp.relative_to(ch_in)
                          dmd.append(f"- [{md_escape(fp.name)}](/{rel(web)})")
                      dmd.append("\n:::{admonition} Jak osadzić CSV jako tabelę?\n```{{csv-table}} Tabela\n:header: \"col1\", \"col2\"\n:file: ../_imported/%s/datasets/<PLIK.csv>\n```\n:::\n" % ch)
                  else:
                      dmd.append("_Brak plików danych._\n")
              else:
                  dmd.append("_Brak katalogu `datasets/`._\n")
              (ch_out/"datasets.md").write_text("\n".join(dmd), encoding="utf-8")

              # diagrams.md
              img_ext = {".png",".jpg",".jpeg",".svg",".gif",".webp"}
              gmd = [f"# {ch} — Diagrams\n"]
              if diagrams_dir.exists():
                  imgs = [p for p in diagrams_dir.rglob("*") if p.suffix.lower() in img_ext]
                  if imgs:
                      for fp in sorted(imgs):
                          web = pathlib.Path('authoring') / "_imported" / ch / fp.relative_to(ch_in)
                          gmd.append(f"### {md_escape(fp.name)}\n![{md_escape(fp.name)}](/{rel(web)})\n")
                  else:
                      gmd.append("_Brak obrazów w `diagrams/`._\n")
              else:
                  gmd.append("_Brak katalogu `diagrams/`._\n")
              (ch_out/"diagrams.md").write_text("\n".join(gmd), encoding="utf-8")

          # hub
          hub = DOCS / "authoring" / "index.md"
          cards = [
            "---\ntitle: Authoring — rozdziały\n---\n",
            "# Authoring — rozdziały\n",
            "::: {admonition} Jak to działa?\n:class: tip\nTo są strony **wewnątrz dokumentacji**; nie przenoszą do GitHuba.\n:::\n",
            "::: {grid} 1 1 2 2\n:gutter: 2\n"
          ]
          for ch in chapters:
            cards.append(f"::: {{grid-item-card}} {ch}\n:link: {ch}/index\n:link-type: doc\n:shadow: md\nWejście do rozdziału `{ch}`.\n:::\n")
          cards.append(":::\n")
          hub.parent.mkdir(parents=True, exist_ok=True)
          hub.write_text("".join(cards), encoding="utf-8")
          print("Authoring pages generated.")
          PY

      - name: Build Sphinx HTML (don’t fail on warnings)
        run: |
          set -e
          sphinx-build -b html -E -a docs docs/_build/html || echo "::warning ::Sphinx returned non-zero (warnings). Continuing."
          touch docs/_build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
