name: Build & Deploy Docs (Sphinx)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/sphinx-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install doc dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f docs/requirements.txt ]; then
            pip install -r docs/requirements.txt
          else
            pip install sphinx==7.4.7 myst-parser>=4.0.1 pydata-sphinx-theme>=0.16.1 \
                        sphinx-copybutton>=0.5.2 sphinx-design>=0.6.0 sphinx-sitemap>=2.6.0 \
                        linkify-it-py>=2.0.2 sphinxext-opengraph>=0.9.1 sphinx-favicon>=1.0.1 \
                        sphinxcontrib-mermaid>=0.9.2 sphinx-codeautolink>=0.15.0 \
                        sphinx-hoverxref>=1.4.2,<1.5 ablog matplotlib
          # sanity check
          python -c "import sys; print('Python', sys.version)"
          python -c "import sphinx, pydata_sphinx_theme; print('Sphinx ok')"

      - name: Generate authoring pages
        run: |
          python scripts/gen_authoring.py

      - name: Build Sphinx
        run: |
          sphinx-build -b html docs docs/_build/html
          touch docs/_build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
