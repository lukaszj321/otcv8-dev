steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Cache pip
    uses: actions/cache@v4
    with:
      path: ~/.cache/pip
      key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
      restore-keys: |
        ${{ runner.os }}-pip-

  - name: Install system deps
    run: |
      set -euo pipefail
      sudo apt-get update
      sudo apt-get install -y --no-install-recommends \
        graphviz fonts-dejavu-core doxygen luarocks
    shell: bash

  - name: Install doc dependencies
    run: |
      set -euo pipefail
      python -m pip install --upgrade pip wheel setuptools
      if [ -f docs/requirements.txt ]; then
        pip install -r docs/requirements.txt
      else
        pip install sphinx pydata-sphinx-theme myst-parser sphinxcontrib-mermaid sphinx-design sphinx_copybutton breathe exhale
      fi
    env:
      PIP_NO_CACHE_DIR: "off"
    shell: bash

  - name: Configure Pages (base URL)
    id: pages
    uses: actions/configure-pages@v5

  - name: Sync external API docs (optional)
    run: |
      set -euo pipefail
      mkdir -p docs/autoapi/external/lua
      if [ -f api/otcv8-full-api.md ]; then
        cp -f api/otcv8-full-api.md docs/autoapi/external/ || true
      fi
      if [ -f api/lua/luafunctions_client.md ]; then
        cp -f api/lua/luafunctions_client.md docs/autoapi/external/lua/ || true
      fi
    shell: bash

  - name: Generate authoring pages (optional)
    run: |
      set -euo pipefail
      if [ -f scripts/build_authoring_pages.py ]; then python scripts/build_authoring_pages.py; fi
    shell: bash

  - name: Patch Mermaid diagrams (optional)
    run: |
      set -euo pipefail
      if [ -f scripts/patch_diagrams_clicks.py ]; then python scripts/patch_diagrams_clicks.py; fi
    shell: bash

  - name: Prepare Doxygen output dir
    run: mkdir -p docs/_build/doxygen
    shell: bash

  - name: Generate Doxygen XML
    run: |
      set -euo pipefail
      if [ -f Doxyfile ]; then
        doxygen Doxyfile || echo "doxygen failed (non-fatal)"; fi
    shell: bash

  - name: Check Doxygen output
    run: |
      if [ -d docs/_build/doxygen/xml ]; then
        echo "Doxygen xml present"; ls -1 docs/_build/doxygen/xml | head || true
      else
        echo "No Doxygen xml produced"
      fi
    shell: bash

  - name: Install LDoc (local) and add to PATH
    run: |
      set -euo pipefail
      luarocks install --local ldoc || true
      echo "$HOME/.luarocks/bin" >> $GITHUB_PATH
    shell: bash

  - name: Generate Lua docs (modules & src)
    run: |
      set -euo pipefail
      mkdir -p docs/_extra
      ldoc -d docs/_extra/ldoc-modules modules || true
      ldoc -d docs/_extra/ldoc-src src || true
    shell: bash

  - name: Build Sphinx (HTML)
    id: build_docs
    run: |
      set -euo pipefail
      mkdir -p docs/_build
      # Timeout dla tego polecenia (bezpiecznik) — 60 minut
      timeout 60m sphinx-build -E -a -j auto -b html docs docs/_build/html \
        -D mermaid_output_format=raw \
        -D mermaid_version=10.9.1 \
        -D html_baseurl="${{ steps.pages.outputs.base_url }}" \
        1> /tmp/sphinx-out.log 2> /tmp/sphinx-err.log || true
      # ensure an index file exists so upload-pages-artifact has something
      touch docs/_build/html/.nojekyll || true
    shell: bash
    env:
      CI: "true"

  - name: Upload Sphinx error log
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: sphinx-err-log
      path: /tmp/sphinx-err.log
      retention-days: 7

  - name: Upload Sphinx stdout log
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: sphinx-out-log
      path: /tmp/sphinx-out.log
      retention-days: 7

  - name: Upload built HTML as Pages artifact
    if: always()
    uses: actions/upload-pages-artifact@v3
    with:
      path: docs/_build/html

  - name: Build step summary
    if: always()
    run: |
      echo "=== Build step finished ==="
      echo "Sphinx err log exists: " && ls -l /tmp/sphinx-err.log || true
      echo "HTML build dir listing:"
      ls -la docs/_build/html || true
    shell: bash
