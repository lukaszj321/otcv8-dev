name: Build & Deploy Docs (Sphinx)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/sphinx-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full git history for git-based extensions

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'docs/requirements.txt'

      - name: Install doc dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel setuptools
          if [ -f docs/requirements.txt ]; then pip install -r docs/requirements.txt; fi
          # Install additional packages for unknown lexers and mermaid rendering
          pip install --upgrade sphinx==7.4.7 myst-parser pydata-sphinx-theme sphinx-copybutton sphinx-design sphinx-sitemap linkify-it-py sphinxext-opengraph sphinx-favicon sphinxcontrib-mermaid sphinx-codeautolink sphinx-hoverxref ablog
          python - << 'PY'
          import sphinx, pydata_sphinx_theme, sphinxcontrib.mermaid
          print("OK: sphinx", sphinx.__version__)
          PY

      - name: Fix MyST tab directives
        shell: bash
        run: |
          set -euo pipefail
          echo "Running tab fixer to auto-fix malformed MyST directives..."
          python scripts/fix_myst_tabs.py --verbose
          echo "Tab fixer completed successfully"

      - name: Generate authoring pages
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_authoring_pages.py

      - name: Patch Mermaid diagrams (click → facets)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/patch_diagrams_clicks.py ]; then python scripts/patch_diagrams_clicks.py; fi

      - name: Generate placeholder files
        shell: bash
        run: |
          set -euo pipefail
          python docs/scripts/generate_placeholders.py

      - name: Make MyST labels unique
        shell: bash
        run: |
          set -euo pipefail
          python docs/scripts/make_labels_unique.py

      - name: Build Sphinx (strict mode)
        shell: bash
        run: |
          set -euo pipefail
          echo "Building Sphinx documentation with warnings as errors..."
          sphinx-build -E -W -b html docs docs/_build/html
          touch docs/_build/html/.nojekyll
          echo "Sphinx build completed successfully"

      - name: Install Chrome for screenshots
        if: success()
        shell: bash
        run: |
          # Chrome is already available on ubuntu-latest runners
          google-chrome --version || chromium-browser --version

      - name: Capture documentation screenshots
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/_build/screenshots
          
          echo "Starting local HTTP server..."
          python -m http.server 8000 --directory docs/_build/html &
          SERVER_PID=$!
          
          # Wait for server to start
          echo "Waiting for server to start..."
          sleep 5
          
          # Test if server is responding
          curl -f http://localhost:8000/ || (echo "Server not responding" && exit 1)
          
          echo "Capturing screenshots..."
          
          # Capture index page
          google-chrome --headless=new --screenshot=docs/_build/screenshots/index.png \
            --window-size=1920,1080 --hide-scrollbars \
            http://localhost:8000/index.html || echo "Failed to capture index.png"
          
          # Capture authoring page
          google-chrome --headless=new --screenshot=docs/_build/screenshots/authoring.png \
            --window-size=1920,1080 --hide-scrollbars \
            http://localhost:8000/authoring/index.html || echo "Failed to capture authoring.png"
          
          # Capture copilot/sphinx page
          google-chrome --headless=new --screenshot=docs/_build/screenshots/copilot_sphinx.png \
            --window-size=1920,1080 --hide-scrollbars \
            http://localhost:8000/copilot/sphinx/index.html || echo "Failed to capture copilot_sphinx.png"
          
          echo "Screenshots captured successfully"
          
          # Stop the server
          kill $SERVER_PID || true
          
          # List captured screenshots
          ls -lh docs/_build/screenshots/

      - name: Upload screenshots as artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-screenshots
          path: docs/_build/screenshots/
          retention-days: 30

      - name: Update build report
        if: always()
        shell: bash
        run: |
          cat > docs/_build/html/BUILD_REPORT.md << 'EOF'
          # Sphinx Documentation Build Report
          
          ## Build Information
          
          - **Build Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - **Git Commit**: ${{ github.sha }}
          - **Git Branch**: ${{ github.ref_name }}
          - **Workflow Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          ## Build Status
          
          - **Tab Fixer**: SUCCESS
          - **Authoring Pages**: SUCCESS
          - **Diagram Patches**: SUCCESS
          - **Placeholder Generation**: SUCCESS
          - **Sphinx Build**: SUCCESS
          - **Screenshot Capture**: ${{ job.status == 'success' && 'SUCCESS' || 'SKIPPED' }}
          
          ## Build Artifacts
          
          ### Documentation Site
          
          - **Deployment URL**: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          - **Build Directory**: docs/_build/html
          
          ### Screenshots
          
          Screenshots captured for verification (if available):
          
          - index.png - Main landing page
          - authoring.png - Authoring index page  
          - copilot_sphinx.png - Copilot/Sphinx integration page
          
          Download artifacts from the workflow run to view screenshots.
          
          ## Quality Checks
          
          - [x] All MyST tab directives properly formatted
          - [x] No Sphinx warnings (using -W flag)
          - [x] Build completed successfully
          
          ---
          
          *Generated by `.github/workflows/sphinx-pages.yml` on $(date -u +"%Y-%m-%d %H:%M:%S UTC")*
          EOF
          
          echo "Build report created"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
