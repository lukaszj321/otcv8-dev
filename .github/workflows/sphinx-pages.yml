# .github/workflows/sphinx-pages.yml
name: Build & Deploy Docs (Sphinx) Page

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/sphinx-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps (Doxygen/Graphviz)
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Setup Node (for extract-api.mjs)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node deps (glob) for extract script
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install glob@^10 --no-audit --no-fund

      - name: Install Python deps for Sphinx
        run: |
          python -m pip install --upgrade pip
          if [ -f docs/requirements.txt ]; then
            pip install -r docs/requirements.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            # fallback (nieużywany u Ciebie, ale zostawiamy awaryjnie)
            pip install sphinx myst-parser pydata-sphinx-theme
          fi
          # sanity-check na theme
          python - << 'PY'
          import importlib; import sys
          for mod in ["pydata_sphinx_theme","myst_parser","sphinx"]:
              try:
                  importlib.import_module(mod)
              except Exception as e:
                  print(f"[FATAL] missing {mod}: {e}", file=sys.stderr); sys.exit(2)
          print("[OK] Python deps present.")
          PY

      # --- ZAWSZE generujemy XML do .doxygen/xml w CI ---
      - name: Pre-generate Doxygen XML -> .doxygen/xml
        run: |
          set -euxo pipefail
          cat > Doxyfile.ci << 'EOF'
          PROJECT_NAME           = OTCv8 CI
          OUTPUT_DIRECTORY       = .doxygen
          GENERATE_XML           = YES
          XML_OUTPUT             = xml
          GENERATE_HTML          = NO
          QUIET                  = YES
          EXTRACT_ALL            = YES
          RECURSIVE              = YES
          FILE_PATTERNS          = *.h *.hpp *.hh *.hxx *.c *.cc *.cpp
          INPUT                  = src include
          WARN_IF_UNDOCUMENTED   = NO
          WARNINGS               = YES
          WARN_LOGFILE           = .doxygen/doxygen-warnings.log
          EOF

          rm -rf .doxygen || true
          mkdir -p .doxygen
          doxygen Doxyfile.ci

          test -f .doxygen/xml/index.xml || { echo "::error ::Brak .doxygen/xml/index.xml po Doxygen"; exit 2; }
          echo "== LIST .doxygen/xml =="
          ls -la .doxygen/xml | head -n 50

      - name: Generate C++ API (Doxygen -> Markdown)
        env:
          DOXY_XML_DIR: .doxygen/xml
        run: |
          set -euxo pipefail
          if [ -f scripts/gen_api_cpp.sh ]; then
            chmod +x scripts/gen_api_cpp.sh
            bash scripts/gen_api_cpp.sh
          else
            echo "::warning ::Brak scripts/gen_api_cpp.sh – pomijam ten krok."
          fi

      - name: Extract OTCv8 API (Lua/WS/OTUI/CPP index) via Node script
        run: |
          set -euxo pipefail
          if [ -f scripts/extract-api.mjs ]; then
            node scripts/extract-api.mjs
          else
            echo "::warning ::Brak scripts/extract-api.mjs – pomijam ten krok."
          fi

      - name: Build Sphinx
        run: |
          sphinx-build -b html docs docs/_build/html
          touch docs/_build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
