name: Build & Deploy Docs (Sphinx) Page

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - '.github/workflows/sphinx-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin do 3.11, żeby unikać przypadkowych zmian 3.12/3.13
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (Sphinx + theme)
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          if [ -f docs/requirements.txt ]; then
            pip install -r docs/requirements.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          # Wymuś instalację kluczowych pakietów, gdyby requirements zostało pominięte/kolidowało
          pip install "sphinx>=7.4.0" "myst-parser>=4.0.1" "pydata-sphinx-theme>=0.16.1"
          # Szybka weryfikacja, żeby złapać problem PRZED buildem
          python - <<'PY'
import sys
print("Python:", sys.version)
import sphinx, myst_parser
print("Sphinx:", sphinx.__version__)
print("MyST:", getattr(myst_parser, "__version__", "ok"))
import pydata_sphinx_theme as t
print("PyData theme:", getattr(t, "__version__", "ok"))
PY

      - name: Build Sphinx
        shell: bash
        run: |
          set -euxo pipefail
          sphinx-build -b html docs docs/_build/html
          touch docs/_build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
