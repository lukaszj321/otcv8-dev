name: Build Modules Preview (MkDocs)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/modules/**'
      - 'mkdocs.modules.yml'
      - '.github/workflows/docs-modules-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MkDocs deps
        run: |
          python -m pip install --upgrade pip
          pip install \
            mkdocs==1.6.1 \
            mkdocs-material \
            mkdocs-exclude \
            pymdown-extensions

      - name: Build modules preview
        run: |
          set -euo pipefail
          mkdocs build --clean -f mkdocs.modules.yml -v
