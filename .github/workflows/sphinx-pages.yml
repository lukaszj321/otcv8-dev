name: Build & Deploy Docs (Sphinx)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - '.github/workflows/sphinx-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: System deps (Graphviz)
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f docs/requirements.txt ]; then
            pip install -r docs/requirements.txt
          else
            # awaryjnie – gdyby nie było pliku
            pip install \
              sphinx==7.4.7 \
              myst-parser>=4.0.1 \
              pydata-sphinx-theme>=0.16.1 \
              sphinx-copybutton>=0.5.2 \
              sphinx-design>=0.6.0 \
              sphinx-sitemap>=2.6.0 \
              linkify-it-py>=2.0.2 \
              sphinxext-opengraph>=0.9.1 \
              sphinx-favicon>=1.0.1 \
              sphinxcontrib-mermaid>=0.9.2 \
              sphinx-codeautolink>=0.15.0 \
              sphinx-hoverxref>=1.4.2 \
              ablog>=0.11.0

          # pewność, że motyw jest
          pip show pydata-sphinx-theme || pip install pydata-sphinx-theme>=0.16.1

      - name: Clean Sphinx cache
        run: rm -rf docs/_build

      - name: Build Sphinx HTML
        run: |
          set -e
          sphinx-build -b html -E -a docs docs/_build/html
          # NIE używamy -W, żeby warningi nie przerywały joba
          touch docs/_build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
