name: Build & Deploy Docs (Sphinx) Page

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - '.github/workflows/sphinx-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # (opcjonalnie) systemowa zależność dla graphviz, jeśli kiedyś włączysz rozszerzenie graphviz
      - name: Install system packages (graphviz optional)
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz || true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('docs/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          if [ -f docs/requirements.txt ]; then
            pip install -r docs/requirements.txt
          else
            # awaryjnie, gdyby pliku nie było
            pip install sphinx myst-parser pydata-sphinx-theme \
                       sphinx-copybutton sphinx-design sphinx-sitemap \
                       linkify-it-py sphinxext-opengraph sphinx-favicon \
                       sphinxcontrib-mermaid sphinx-codeautolink sphinx-hoverxref \
                       ablog matplotlib pillow
          fi
          python - << 'PY'
          import importlib, sys
          for mod in ["pydata_sphinx_theme","ablog","matplotlib"]:
              importlib.import_module(mod)
          print("deps-ok")
          PY

      - name: Setup Node (for authoring-discover)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate authoring auto-pages
        run: |
          node --version
          node scripts/authoring-discover.mjs

      - name: Build Sphinx
        run: |
          sphinx-build -b html docs docs/_build/html
          touch docs/_build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
