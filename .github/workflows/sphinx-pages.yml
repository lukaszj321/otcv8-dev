name: Build & Deploy Docs (Sphinx)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'src/**'
      - 'modules/**'
      - 'Doxyfile'
      - '.github/workflows/sphinx-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Increase timeout for large documentation builds
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # System deps (graphviz + doxygen + luarocks)
      - name: Install system deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            graphviz fonts-dejavu-core doxygen luarocks
          dot -V || true
          doxygen -v || true
          luarocks --version || true

      # Python deps (Sphinx + extensions, incl. Breathe/Mermaid)
      - name: Install doc dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel setuptools
          pip install -r docs/requirements.txt

      - name: Configure Pages (base URL)
        id: pages
        uses: actions/configure-pages@v5

      # (opcjonalnie) sync ręcznych plików API
      - name: Sync external API docs
        run: |
          set -euo pipefail
          mkdir -p docs/autoapi/external/lua
          if [ -f api/otcv8-full-api.md ]; then 
            cp -f api/otcv8-full-api.md docs/autoapi/external/ || true
          fi
          if [ -f api/lua/luafunctions_client.md ]; then 
            cp -f api/lua/luafunctions_client.md docs/autoapi/external/lua/ || true
          fi

      # Autorskie generatory (jeśli są)
      - name: Generate authoring pages
        run: |
          set -euo pipefail
          if [ -f scripts/build_authoring_pages.py ]; then python scripts/build_authoring_pages.py; fi

      - name: Patch Mermaid diagrams (click → facets)
        run: |
          set -euo pipefail
          if [ -f scripts/patch_diagrams_clicks.py ]; then python scripts/patch_diagrams_clicks.py; fi

      # C++ API → Doxygen XML (for Breathe)
      - name: Prepare Doxygen output dir
        run: mkdir -p docs/_build/doxygen

      - name: Generate Doxygen XML
        run: doxygen Doxyfile

      - name: Check Doxygen output
        run: |
          test -d docs/_build/doxygen/xml
          ls -1 docs/_build/doxygen/xml | head

      # Lua API → LDoc (dwa oddzielne pakiety: modules i src) — lokalna instalacja + PATH
      - name: Install LDoc (local) and add to PATH
        run: |
          set -euo pipefail
          luarocks install --local ldoc
          echo "$HOME/.luarocks/bin" >> $GITHUB_PATH

      - name: Verify LDoc installation
        run: ldoc -V || true

      - name: Generate Lua docs (modules & src)
        run: |
          set -euo pipefail
          mkdir -p docs/_extra
          # osobno: modules/
          ldoc -d docs/_extra/ldoc-modules modules || true
          # osobno: src/ (tylko .lua będą zindeksowane)
          ldoc -d docs/_extra/ldoc-src src || true

      # Build Sphinx (RAW Mermaid)
      - name: Build Sphinx
        run: |
          set -euo pipefail
          sphinx-build -E -a -j auto -b html docs docs/_build/html \
            -D mermaid_output_format=raw -D mermaid_version=10.9.1 \
            -D html_baseurl="${{ steps.pages.outputs.base_url }}"
          touch docs/_build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
