name: Build & Deploy Docs (Sphinx)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'src/**'
      - 'modules/**'
      - 'Doxyfile'
      - '.github/workflows/sphinx-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # System deps
      - name: Install system deps (Graphviz)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz fonts-dejavu-core
          dot -V

      # Mermaid CLI (server-side SVG rendering)
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Mermaid CLI (mmdc)
        run: npm i -g @mermaid-js/mermaid-cli@10.9.1

      - name: Install headless browser deps for mmdc (Ubuntu 24.04)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libx11-xcb1 \
            libxcomposite1 libxdamage1 libxrandr2 libgbm1 \
            libpango-1.0-0 libpangocairo-1.0-0 libgtk-3-0 || true
          # audio lib name changed on Noble; try t64 first, then legacy
          sudo apt-get install -y --no-install-recommends libasound2t64 || \
          sudo apt-get install -y --no-install-recommends libasound2 || true

      - name: Check mmdc
        run: mmdc -V

      # Python deps (Sphinx + extensions, incl. Breathe)
      - name: Install doc dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel setuptools
          if [ -f docs/requirements.txt ]; then pip install -r docs/requirements.txt; fi
          python - << 'PY'
          import sys, subprocess
          def ensure(spec):
              try:
                  __import__(spec.split("==")[0].split(">=")[0].replace("-", "_"))
              except Exception:
                  subprocess.check_call([sys.executable, "-m", "pip", "install", spec])
          ensure("Sphinx==8.2.3")
          ensure("pydata-sphinx-theme>=0.16.1")
          ensure("myst-nb==1.3.0")
          ensure("myst-parser>=3.0.1")
          ensure("sphinxcontrib-mermaid>=0.9.2")
          ensure("breathe>=4.35.0")
          ensure("sphinx-sitemap==2.9.0")
          ensure("sphinx_design>=0.6.1")
          ensure("sphinx-copybutton>=0.5.2")
          ensure("sphinx-codeautolink>=0.17.5")
          ensure("sphinxext-opengraph>=0.13.0")
          ensure("sphinxcontrib-jquery>=4.1")
          try:
              ensure("sphinx-favicon")
          except Exception:
              pass
          print("✓ dependencies ensured")
          PY
          python - << 'PY'
          import sphinx, pydata_sphinx_theme, sphinxcontrib.mermaid, myst_nb, sphinx_design, breathe
          print("✓ sphinx", sphinx.__version__)
          print("✓ pydata-sphinx-theme", pydata_sphinx_theme.__version__)
          print("✓ sphinxcontrib-mermaid OK")
          print("✓ myst-nb OK")
          print("✓ sphinx-design OK")
          print("✓ breathe OK")
          PY

      - name: Configure Pages (base URL)
        id: pages
        uses: actions/configure-pages@v5

      # Opcjonalny sync ręcznych plików API
      - name: Sync external API docs
        run: |
          set -euo pipefail
          mkdir -p docs/autoapi/external/lua
          if [ -f api/otcv8-full-api.md ]; then 
            cp -f api/otcv8-full-api.md docs/autoapi/external/ || true
          fi
          if [ -f api/lua/luafunctions_client.md ]; then 
            cp -f api/lua/luafunctions_client.md docs/autoapi/external/lua/ || true
          fi
          echo "✓ API docs synced to docs/autoapi/external/"

      - name: Generate authoring pages (custom)
        run: |
          set -euo pipefail
          if [ -f scripts/build_authoring_pages.py ]; then python scripts/build_authoring_pages.py; fi

      - name: Patch Mermaid diagrams (click → facets)
        run: |
          set -euo pipefail
          if [ -f scripts/patch_diagrams_clicks.py ]; then python scripts/patch_diagrams_clicks.py; fi

      # C++ API → Doxygen XML (for Breathe)
      - name: Install Doxygen (for C++ API)
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Prepare Doxygen output dir
        run: mkdir -p docs/_build/doxygen

      - name: Generate Doxygen XML
        run: doxygen Doxyfile

      - name: Check Doxygen output
        run: |
          test -d docs/_build/doxygen/xml
          ls -1 docs/_build/doxygen/xml | head

      # Lua API → LDoc (HTML copied via html_extra_path)
      - name: Install LDoc (for Lua API)
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks
          sudo luarocks install ldoc

      - name: Generate Lua docs (LDoc -> docs/_extra/ldoc)
        run: |
          set -euo pipefail
          mkdir -p docs/_extra
          ldoc -d docs/_extra/ldoc modules

      - name: Build Sphinx
        run: |
          set -euo pipefail
          sphinx-build -E -a -q -b html docs docs/_build/html \
            -D html_baseurl="${{ steps.pages.outputs.base_url }}"
          touch docs/_build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
