name: Build & Deploy Docs (Sphinx)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/sphinx-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install doc dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel setuptools
          # Install from requirements.txt first (ensures version consistency)
          if [ -f docs/requirements.txt ]; then pip install -r docs/requirements.txt; fi
          # Verify critical packages are loaded
          python - << 'PY'
          import sphinx, pydata_sphinx_theme, sphinxcontrib.mermaid, myst_nb, sphinx_design
          print("✓ sphinx", sphinx.__version__)
          print("✓ pydata-sphinx-theme", pydata_sphinx_theme.__version__)
          print("✓ sphinxcontrib-mermaid installed")
          print("✓ myst-nb installed")
          print("✓ sphinx-design installed")
          PY

      - name: Sync API docs into docs/api/external
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/api/external/lua
          # Copy API files if they exist in api/ directory
          if [ -f api/otcv8-full-api.md ]; then 
            cp -f api/otcv8-full-api.md docs/api/external/ || true
          fi
          if [ -f api/lua/luafunctions_client.md ]; then 
            cp -f api/lua/luafunctions_client.md docs/api/external/lua/ || true
          fi
          echo "✓ API docs synced to docs/api/external/"

      - name: Generate authoring pages
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_authoring_pages.py

      - name: Patch Mermaid diagrams (click → facets)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/patch_diagrams_clicks.py ]; then python scripts/patch_diagrams_clicks.py; fi

      - name: Build Sphinx
        shell: bash
        run: |
          set -euo pipefail
          sphinx-build -b html docs docs/_build/html
          touch docs/_build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
