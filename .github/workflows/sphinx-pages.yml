name: Build & Deploy Docs (Sphinx) Page

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - '.github/workflows/sphinx-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip wheel setuptools
          if [ -f docs/requirements.txt ]; then
            pip install --upgrade -r docs/requirements.txt
          elif [ -f requirements.txt ]; then
            pip install --upgrade -r requirements.txt
          fi
          # Twarde doinstalowanie aby nigdy nie brakowało:
          pip install --upgrade ablog matplotlib

          # Szybka weryfikacja obecności modułów, zanim odpali Sphinx
          python - <<'PY'
          import sys
          try:
              import ablog, matplotlib
              print("OK: ablog", ablog.__version__, "matplotlib", matplotlib.__version__)
          except Exception as e:
              print("CHECK FAILED:", e); sys.exit(1)
          PY

      - name: Pre-build Authoring pages (optional)
        run: |
          set -euxo pipefail
          if [ -f scripts/build_authoring.py ]; then
            python scripts/build_authoring.py
          fi

      - name: Build Sphinx
        run: |
          set -euxo pipefail
          sphinx-build -E -b html docs docs/_build/html
          touch docs/_build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
