# .github/workflows/sphinx-pages.yml
name: Build & Deploy Docs (Sphinx) Page

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - 'scripts/extract-api.mjs'
      - '.github/workflows/sphinx-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Python do Sphinx
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Node do uruchomienia scripts/extract-api.mjs (jeśli jest)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f docs/requirements.txt ]; then
            pip install -r docs/requirements.txt
            # Upewnij się, że motyw jest NA PEWNO zainstalowany
            pip install --upgrade "pydata-sphinx-theme>=0.16.1"
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
            pip install --upgrade "pydata-sphinx-theme>=0.16.1"
          else
            pip install "sphinx>=7.4.7" "myst-parser>=4.0.1" "pydata-sphinx-theme>=0.16.1"
          fi

      - name: Install Node deps for extractor (optional)
        if: ${{ hashFiles('scripts/extract-api.mjs') != '' }}
        run: |
          npm init -y >/dev/null 2>&1 || true
          # extract-api.mjs używa 'glob'
          npm i --no-save glob@^10

      - name: Generate API docs (optional)
        if: ${{ hashFiles('scripts/extract-api.mjs') != '' }}
        run: |
          # spróbuj pełnego splitu C++; jak nie, fallback bez splitu
          node scripts/extract-api.mjs --split-cpp || node scripts/extract-api.mjs

      - name: Build Sphinx
        run: |
          sphinx-build -b html docs docs/_build/html
          touch docs/_build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
