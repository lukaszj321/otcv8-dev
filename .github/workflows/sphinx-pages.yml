name: Build & Deploy Docs (Sphinx)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/sphinx-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install doc dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel setuptools
          # Jeśli masz własny requirements, zainstaluj go najpierw:
          if [ -f docs/requirements.txt ]; then pip install -r docs/requirements.txt; fi
          # Do-instaluj WSZYSTKO, co bywa brakujące w CI
          pip install --upgrade sphinx==7.4.7 myst-parser pydata-sphinx-theme sphinx-copybutton sphinx-design sphinx-sitemap linkify-it-py sphinxext-opengraph sphinx-favicon sphinxcontrib-mermaid sphinx-codeautolink sphinx-hoverxref ablog matplotlib
          # sanity-check
          python - << 'PY'
          import sphinx, pydata_sphinx_theme, ablog, matplotlib, sphinxcontrib.mermaid
          print("OK: sphinx,", sphinx.__version__)
          PY

      - name: Generate authoring pages
        shell: bash
        run: |
          set -euo pipefail
          python scripts/gen_authoring.py

      - name: Build Sphinx
        shell: bash
        run: |
          set -euo pipefail
          sphinx-build -b html docs docs/_build/html
          touch docs/_build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
