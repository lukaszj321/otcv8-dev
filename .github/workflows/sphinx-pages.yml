name: Build & Deploy Docs (Sphinx) Page

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'src/**'
      - 'include/**'
      - '.github/workflows/sphinx-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Python (Sphinx) ---
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Sphinx deps
        run: |
          python -m pip install --upgrade pip
          if [ -f docs/requirements.txt ]; then
            pip install -r docs/requirements.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install sphinx myst-parser pydata-sphinx-theme sphinx-copybutton sphinx-design
          fi

      # --- Node (extract-api.mjs) ---
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node deps for extract scripts
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            npm init -y >/dev/null 2>&1
            npm i glob >/dev/null 2>&1
          fi

      # --- Doxygen (C++ -> XML) ---
      - name: Install Doxygen & Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Ensure Doxyfile (XML -> .doxygen/xml)
        run: |
          # jeśli nie ma Doxyfile, wygeneruj
          if [ ! -f Doxyfile ]; then
            doxygen -g Doxyfile
          fi

          # OUTPUT/XML: .doxygen/xml
          sed -i 's|^#\? *OUTPUT_DIRECTORY .*|OUTPUT_DIRECTORY = .doxygen|' Doxyfile
          sed -i 's|^#\? *GENERATE_XML .*|GENERATE_XML = YES|' Doxyfile
          sed -i 's|^#\? *XML_OUTPUT .*|XML_OUTPUT = xml|' Doxyfile

          # źródła i rekursja
          if grep -qE '^#? *INPUT *=' Doxyfile; then
            sed -i 's|^#\? *INPUT .*|INPUT = src include|' Doxyfile
          else
            echo 'INPUT = src include' >> Doxyfile
          fi
          sed -i 's|^#\? *RECURSIVE .*|RECURSIVE = YES|' Doxyfile

          # trochę rozsądnych flag (bez HTML, szybciej)
          sed -i 's|^#\? *GENERATE_HTML .*|GENERATE_HTML = NO|' Doxyfile
          sed -i 's|^#\? *EXTRACT_ALL .*|EXTRACT_ALL = YES|' Doxyfile
          sed -i 's|^#\? *QUIET .*|QUIET = YES|' Doxyfile

      # --- API extraction (Lua/OTUI/WS + C++ via Doxygen) ---
      - name: Run extract-api (JS)
        run: |
          # preferowany skrypt
          if [ -f scripts/extract-api.mjs ]; then
            node scripts/extract-api.mjs --split-cpp
          # fallback, jeśli repo ma alternatywną nazwę
          elif [ -f scripts/scripts_extract-api.mjs ]; then
            node scripts/scripts_extract-api.mjs --split-cpp
          else
            echo "::warning ::Brak scripts/extract-api.mjs (ani scripts/scripts_extract-api.mjs) – pomijam ten krok."
          fi

      - name: Generate C++ API (Doxygen -> Markdown)
        run: |
          if [ -f scripts/gen_api_cpp.sh ]; then
            chmod +x scripts/gen_api_cpp.sh
            bash scripts/gen_api_cpp.sh
          else
            echo "::warning ::Brak scripts/gen_api_cpp.sh – pomijam ten krok."
          fi

      # --- Build Sphinx ---
      - name: Build Sphinx
        run: |
          sphinx-build -b html docs docs/_build/html
          touch docs/_build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
