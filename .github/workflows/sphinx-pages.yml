name: Build & Deploy Docs (Sphinx) Page

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - 'scripts/gen_authoring.py'
      - '.github/workflows/sphinx-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install docs dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          if [ -f docs/requirements.txt ]; then
            pip install -r docs/requirements.txt
          else
            pip install sphinx==7.4.7 myst-parser pydata-sphinx-theme \
              sphinx-copybutton sphinx-design sphinx-sitemap \
              linkify-it-py sphinxext-opengraph sphinx-favicon \
              sphinxcontrib-mermaid sphinx-codeautolink sphinx-hoverxref \
              ablog matplotlib pandas
          fi

      - name: Generate Authoring pages from reposzablony
        run: |
          set -euxo pipefail
          python scripts/gen_authoring.py

      - name: Build Sphinx
        run: |
          set -euxo pipefail
          sphinx-build -b html docs docs/_build/html
          touch docs/_build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
