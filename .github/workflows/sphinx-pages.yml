# .github/workflows/sphinx-pages.yml
name: Build & Deploy Docs (Sphinx + Modules preview)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - 'schemas/**'
      - 'src/**'
      - 'include/**'
      - 'scripts/**'
      - '.github/workflows/sphinx-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: System deps for docs (doxygen/graphviz)
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Install Python deps (Sphinx)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f docs/requirements.txt ]; then
            pip install -r docs/requirements.txt
          else
            # awaryjnie gdyby plik zniknął
            pip install "sphinx==7.4.7" "myst-parser>=4.0.1" "pydata-sphinx-theme>=0.16.1" \
                        sphinx-copybutton sphinx-design sphinx-sitemap linkify-it-py \
                        sphinxext-opengraph sphinx-favicon sphinxcontrib-mermaid \
                        sphinx-codeautolink "sphinx-hoverxref>=1.4.2,<1.5"
          fi
          # opcjonalnie – wycisza ostrzeżenie o social cards
          pip install matplotlib || true
          # info diagnostyczne
          python -V
          pip freeze

      - name: (Optional) Generate C++ API via Doxygen -> md
        id: gen_cpp
        continue-on-error: true
        run: |
          if [ -f scripts/gen_api_cpp.sh ]; then
            chmod +x scripts/gen_api_cpp.sh
            bash scripts/gen_api_cpp.sh
          else
            echo "::warning ::Brak scripts/gen_api_cpp.sh – pomijam ten krok."
          fi

      - name: (Optional) Extract API (Node script)
        id: extract_api
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run extract-api.mjs (if present)
        if: ${{ always() }}
        continue-on-error: true
        run: |
          if [ -f scripts/extract-api.mjs ]; then
            # upewnij się, że mamy 'glob'
            node -e "require('glob')" 2>/dev/null || {
              npm init -y >/dev/null 2>&1 || true
              npm i glob@^10 --save-dev
            }
            node scripts/extract-api.mjs --split-cpp || true
          else
            echo "No scripts/extract-api.mjs – skipping."
          fi

      - name: Build Sphinx (HTML)
        run: |
          sphinx-build -b html docs docs/_build/html
          touch docs/_build/html/.nojekyll

      # ------- MKDOCS MODULES PREVIEW  -------
      - name: Install MkDocs deps
        run: |
          pip install "mkdocs>=1.6.0" "mkdocs-material>=9.5.0" mkdocs-exclude
          mkdocs --version || true

      - name: Build modules preview with MkDocs (if config exists)
        run: |
          if [ -f mkdocs.modules.yml ]; then
            mkdocs build --clean -f mkdocs.modules.yml -v
            # skopiuj wynik do Sphinxowego buildu, żeby wszystko poszło w jednym deployu
            mkdir -p docs/_build/html/modules-preview
            rsync -a site-modules/ docs/_build/html/modules-preview/
          else
            echo "mkdocs.modules.yml not found – skipping modules preview."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
