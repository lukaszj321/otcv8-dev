# .github/workflows/sphinx-pages.yml
name: Build & Deploy Docs (Sphinx)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - 'mkdocs.modules.yml'
      - 'scripts/**'
      - '.github/workflows/sphinx-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # (opcjonalnie) narzędzia do C++ → Doxygen/Graphviz
      - name: Install OS deps (doxygen/graphviz)
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Install Python deps (Sphinx + MkDocs)
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel

          # Jeśli masz docs/requirements.txt – użyj go
          if [ -f docs/requirements.txt ]; then
            pip install -r docs/requirements.txt
          fi

          # Twarde dopilnowanie kluczowych paczek Sphinx (naprawia "no theme named pydata_sphinx_theme")
          pip install \
            "pydata-sphinx-theme>=0.16.1" \
            "sphinx==7.4.7" \
            "myst-parser>=4.0.1" \
            "sphinx-copybutton>=0.5.2" \
            "sphinx-design>=0.6.0" \
            "sphinx-sitemap>=2.6.0" \
            "linkify-it-py>=2.0.2" \
            "sphinxext-opengraph>=0.9.1" \
            "sphinx-favicon>=1.0.1" \
            "sphinxcontrib-mermaid>=0.9.2" \
            "sphinx-codeautolink>=0.15.0" \
            "sphinx-hoverxref>=1.4.2,<1.5"

          # Jeśli istnieje mkdocs.modules.yml – doinstaluj mkdocs + plugin exclude (naprawia błąd o exclude)
          if [ -f mkdocs.modules.yml ]; then
            pip install "mkdocs>=1.6.0" "mkdocs-material>=9.5.0" "mkdocs-exclude>=1.0.2"
          fi

          pip list

      # (opcjonalnie) C++ API (nie wysadza buildu, jeśli coś pójdzie nie tak)
      - name: (Optional) Generate C++ API via Doxygen
        if: hashFiles('scripts/gen_api_cpp.sh') != ''
        run: |
          set -euxo pipefail
          chmod +x scripts/gen_api_cpp.sh
          # Nie przerywaj joba w razie błędu w generatorze – tylko ostrzeż
          bash scripts/gen_api_cpp.sh || { echo "::warning ::gen_api_cpp.sh returned non-zero; continuing"; }

      - name: Build Sphinx
        run: |
          set -euxo pipefail
          sphinx-build -b html docs docs/_build/html
          touch docs/_build/html/.nojekyll

      # (opcjonalnie) Podgląd modułów w MkDocs – jeśli masz mkdocs.modules.yml
      - name: (Optional) Build Modules preview (MkDocs)
        if: hashFiles('mkdocs.modules.yml') != ''
        run: |
          set -euxo pipefail
          # Jeśli chcesz, aby błąd MkDocs NIE przerywał release Sphinx – puść jako warning:
          mkdocs build --clean -f mkdocs.modules.yml -v || { echo "::warning ::MkDocs preview failed; continuing"; }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
