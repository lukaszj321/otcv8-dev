name: C++ Matrix Build (OTCv8)

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release, Debug]
    env:
      BUILD_TYPE: ${{ matrix.build_type }}
    steps:
      - uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libboost-all-dev liblua5.1-0-dev libglew-dev libphysfs-dev libssl-dev
          pip install conan

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install boost-msvc14 glew physfs openssl lua conan
          python -m pip install conan

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install boost glew physfs openssl lua@5.3
          pip install conan

      - name: Configure
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: |
          cd build
          cmake --build . --config ${{ env.BUILD_TYPE }}

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure --build-config ${{ env.BUILD_TYPE }}
