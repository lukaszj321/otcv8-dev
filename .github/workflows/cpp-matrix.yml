name: Build — Windows (VC16)

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ x64, Win32 ]   # Win32 = x86 w MSBuild
        configuration: [ Release ]

    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.platform == 'x64' && 'x64-windows' || 'x86-windows' }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore deps via vcpkg (manifest mode + cache)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: '**/vcpkg.json'
          runVcpkgInstall: true
          appendedCacheKey: windows-${{ env.VCPKG_DEFAULT_TRIPLET }}

      - name: Build ${{ matrix.configuration }} ${{ matrix.platform }}
        shell: pwsh
        run: |
          msbuild "vc16/otclient.sln" `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=${{ matrix.platform }} `
            /m

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: otclient-${{ matrix.platform }}-${{ matrix.configuration }}
          if-no-files-found: error
          path: |
            vc16/**/${{ matrix.configuration }}/*.exe
            vc16/**/${{ matrix.configuration }}/*.dll
            vc16/**/${{ matrix.configuration }}/*.pdb
