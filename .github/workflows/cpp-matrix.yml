name: C++ Build (Ubuntu only)

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Release, Debug]
    env:
      BUILD_TYPE: ${{ matrix.build_type }}
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libboost-all-dev liblua5.1-0-dev libglew-dev libphysfs-dev libssl-dev libbz2-dev libzip-dev libluajit-5.1-dev
          pip install conan
      - name: Configure
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DLIBZIP_LIBRARY=/usr/lib/x86_64-linux-gnu/libzip.so \
            -DLIBZIP_INCLUDE_DIR=/usr/include/zip
      - name: Build
        run: |
          cd build
          cmake --build . --config ${{ env.BUILD_TYPE }}
      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure --build-config ${{ env.BUILD_TYPE }}
