name: Build — Windows (VC16)

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ x64, Win32 ]
        configuration: [ Release ]

    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      TRIPLET: ${{ matrix.platform == 'x64' && 'x64-windows-static' || 'x86-windows-static' }}
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.platform == 'x64' && 'x64-windows-static' || 'x86-windows-static' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install vcpkg (classic)
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
          cd $env:VCPKG_ROOT
          .\bootstrap-vcpkg.bat
          .\vcpkg.exe integrate install
          # (opcjonalnie pin wg README:)
          # git checkout 3b3bd424827a1f7f4813216f6b32b6c61e386b2e

      - name: Install deps via vcpkg
        shell: pwsh
        run: |
          $pkgs = @(
            "boost-iostreams","boost-asio","boost-beast","boost-system",
            "boost-variant","boost-lockfree","boost-process","boost-program-options",
            "boost-filesystem","boost-uuid","glew","luajit","physfs",
            "openal-soft","libogg","libvorbis","zlib","libzip","openssl"
          )
          foreach ($p in $pkgs) {
            & "$env:VCPKG_ROOT\vcpkg.exe" install "$($p):$env:TRIPLET" --recurse
          }

      - name: Build ${{ matrix.configuration }} ${{ matrix.platform }}
        shell: pwsh
        run: |
          msbuild "vc16/otclient.sln" `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=${{ matrix.platform }} `
            /m

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: otclient-${{ matrix.platform }}-${{ matrix.configuration }}
          if-no-files-found: error
          path: |
            vc16/**/${{ matrix.configuration }}/*.exe
            vc16/**/${{ matrix.configuration }}/*.dll
            vc16/**/${{ matrix.configuration }}/*.pdb
