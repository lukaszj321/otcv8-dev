name: C++ Matrix Build (desktop)
on:
  push:
    paths: [ "src/**", "include/**", "CMakeLists.txt", ".github/workflows/cpp-matrix.yml" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-14 ]
        build_type: [ Release ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # ---------- Linux ----------
      - name: Install deps (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build build-essential pkg-config \
            libsdl2-dev libglew-dev libphysfs-dev \
            libboost-filesystem-dev libboost-system-dev \
            zlib1g-dev libbz2-dev libzip-dev \
            doxygen graphviz \
            luajit libluajit-5.1-dev

      # ---------- macOS ----------
      - name: Install deps (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew update
          brew install svn
          brew install cmake ninja sdl2 glew physfs doxygen graphviz

      # ---------- Windows ----------
      - name: MSVC dev cmd
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install deps (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          choco install --no-progress ninja git
          git clone https://github.com/microsoft/vcpkg $env:GITHUB_WORKSPACE\vcpkg
          & $env:GITHUB_WORKSPACE\vcpkg\bootstrap-vcpkg.bat
          $triplet = "x64-windows-static"
          # Fix for broken zlib/libzip in vcpkg
          & $env:GITHUB_WORKSPACE\vcpkg\vcpkg.exe remove zlib --recurse
          & $env:GITHUB_WORKSPACE\vcpkg\vcpkg.exe install zlib:$triplet --recurse
          & $env:GITHUB_WORKSPACE\vcpkg\vcpkg.exe install libzip:$triplet --recurse
          & $env:GITHUB_WORKSPACE\vcpkg\vcpkg.exe install `
            boost-iostreams boost-asio boost-beast boost-system `
            boost-variant boost-lockfree boost-process boost-program-options `
            boost-filesystem boost-uuid glew luajit physfs openal-soft `
            libogg libvorbis zlib libzip openssl `
            sdl2 `
            --triplet $triplet
          echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "VCPKG_TRIPLET=$triplet" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ---------- Configure ----------
      - name: Configure (Linux/macOS)
        if: matrix.os == 'ubuntu-latest' || startsWith(matrix.os, 'macos')
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Configure (Windows MSVC + vcpkg)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: >
          cmake -S . -B build -G "Ninja"
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TRIPLET"

      # ---------- Build ----------
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      # ---------- Optional: Doxygen XML (Linux only) ----------
      - name: Doxygen XML (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          doxygen -g doxygen.conf
          sed -i 's/GENERATE_HTML.*/GENERATE_HTML = NO/' doxygen.conf
          sed -i 's/GENERATE_XML.*/GENERATE_XML = YES/' doxygen.conf
          sed -i 's/RECURSIVE.*/RECURSIVE = YES/' doxygen.conf
          sed -i 's/INPUT.*/INPUT = src include/' doxygen.conf
          doxygen doxygen.conf
          mkdir -p build_artifacts/linux/doxygen
          cp -r xml build_artifacts/linux/doxygen/xml

      # ---------- Collect intel ----------
      - name: Collect build intel
        shell: bash
        run: |
          mkdir -p build_artifacts/${{ runner.os }}
          cp build/compile_commands.json build_artifacts/${{ runner.os }}/ || true
          if [[ "$RUNNER_OS" == "Linux" || "$RUNNER_OS" == "macOS" ]]; then
            find build -type f -perm -111 -maxdepth 2 -print0 \
              | xargs -0 -I{} sh -c 'file "{}" | grep -Eq "ELF|Mach-O" || exit 0; nm -gU "{}" > "{}".nm || true'
            tar czf build_artifacts/${{ runner.os }}/symbols.tgz $(find build -name "*.nm" || true)
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: otclient-${{ matrix.os }}-${{ matrix.build_type }}
          path: build_artifacts/${{ runner.os }}
          if-no-files-found: ignore
