name: Build and push extractor image
on:
  workflow_dispatch:
  push:
    paths:
      - 'Dockerfile'
      - 'requirements.txt'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          DATE_TAG=$(date -u +%Y%m%d)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "date_tag=$DATE_TAG" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/otcv8-extractor:latest
            ghcr.io/${{ github.repository_owner }}/otcv8-extractor:${{ steps.tags.outputs.short_sha }}
            ghcr.io/${{ github.repository_owner }}/otcv8-extractor:${{ steps.tags.outputs.date_tag }}
