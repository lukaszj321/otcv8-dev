name: Full extractor

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  pull_request:
    types: [labeled]

env:
  LIBCLANG_VERSION: 14
  NPM_CONFIG_LEGACY_PEER_DEPS: "true"

jobs:
  full-extract:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Add LLVM apt repo (pin libclang) with fallback to jammy
        run: |
          set -euo pipefail
          printf -- "LIBCLANG_VERSION=%s\n" "${LIBCLANG_VERSION}"
          sudo apt-get update -y
          sudo apt-get install -y wget gnupg lsb-release ca-certificates || true
          CODENAME="$(lsb_release -cs || echo unknown)"
          printf -- "Detected distro codename: %s\n" "$CODENAME"
          if curl -sfI "https://apt.llvm.org/dists/${CODENAME}/" >/dev/null 2>&1; then
            printf -- "apt.llvm.org supports %s; using llvm.sh installer for %s\n" "$CODENAME" "${LIBCLANG_VERSION}"
            curl -sSL https://apt.llvm.org/llvm.sh | sudo bash -s -- "${LIBCLANG_VERSION}" || true
            sudo apt-get update -y || true
          else
            printf -- "apt.llvm.org does NOT support %s; falling back to jammy (22.04) packages\n" "$CODENAME"
            wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmour -o /usr/share/keyrings/llvm-archive-keyring.gpg || true
            printf -- "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-14 main\n" | sudo tee /etc/apt/sources.list.d/llvm.list
            sudo apt-get update -y || true
          fi

      - name: Install system dependencies (dev packages + debug)
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libclang-${LIBCLANG_VERSION}-dev \
            llvm-${LIBCLANG_VERSION} \
            cmake python3 python3-venv python3-pip build-essential jq pkg-config \
            libboost-dev libboost-system-dev libboost-filesystem-dev \
            libzip-dev zlib1g-dev libbz2-dev \
            libluajit-5.1-dev libphysfs-dev \
            libgl1-mesa-dev libglu1-mesa-dev libx11-dev \
            libglew-dev || true

          echo "=== dpkg -l | grep relevant libs ==="
          dpkg -l | grep -E "libzip|zlib1g|libbz2|libphysfs|mesa|libgl1|libglu|glew" || true

          echo "=== apt-cache policies ==="
          apt-cache policy libzip-dev libzip4 libphysfs-dev zlib1g-dev libglew-dev || true

          echo "=== dpkg -L libzip-dev (first 200 lines) ==="
          dpkg -L libzip-dev | sed -n '1,200p' || true

          echo "=== dpkg -L libphysfs-dev (first 200 lines) ==="
          dpkg -L libphysfs-dev | sed -n '1,200p' || true

          echo "=== find libs and headers under /usr (first matches) ==="
          find /usr -name "libzip*.so*" -print | head -n 5 || true
          find /usr -name "libz*.so*" -print | head -n 5 || true
          find /usr -name "libphysfs*.so*" -print | head -n 5 || true
          find /usr -name "libGLEW*.so*" -print | head -n 5 || true
          find /usr -name "zip.h" -print | head -n 5 || true
          find /usr -name "zlib.h" -print | head -n 5 || true
          find /usr -name "physfs.h" -print | head -n 5 || true
          find /usr -name "GL/gl.h" -print | head -n 5 || true

          echo "=== pkg-config checks ==="
          pkg-config --exists libzip && pkg-config --cflags --libs libzip || echo "pkg-config libzip not available"
          pkg-config --exists zlib && pkg-config --cflags --libs zlib || echo "pkg-config zlib not available"
          pkg-config --exists physfs && pkg-config --cflags --libs physfs || echo "pkg-config physfs not available"
          pkg-config --exists glew && pkg-config --cflags --libs glew || echo "pkg-config glew not available"

      - name: Create Python venv & install deps
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Install npm deps (tree-sitter) with legacy peer deps and force fallback
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: ${{ env.NPM_CONFIG_LEGACY_PEER_DEPS }}
        run: |
          npm ci --no-audit --no-fund || \
          npm install --legacy-peer-deps --no-audit --no-fund || \
          npm install --legacy-peer-deps --force --no-audit --no-fund || true

      - name: Try to generate compile_commands.json with explicit library paths (fallback)
        run: |
          set -euo pipefail || true
          # find first candidate paths (empty if not present)
          LIBZIP_SO="$(find /usr -name 'libzip.so*' 2>/dev/null | head -n1 || true)"
          LIBZIP_INC="$(find /usr -name 'zip.h' 2>/dev/null | head -n1 || true)"
          if [ -n "$LIBZIP_INC" ]; then LIBZIP_INC="$(dirname "$LIBZIP_INC")"; fi
          ZLIB_SO="$(find /usr -name 'libz.so*' 2>/dev/null | head -n1 || true)"
          ZLIB_INC="$(find /usr -name 'zlib.h' 2>/dev/null | head -n1 || true)"
          if [ -n "$ZLIB_INC" ]; then ZLIB_INC="$(dirname "$ZLIB_INC")"; fi
          PHYSFS_SO="$(find /usr -name 'libphysfs*.so*' 2>/dev/null | head -n1 || true)"
          PHYSFS_INC="$(find /usr -name 'physfs.h' 2>/dev/null | head -n1 || true)"
          if [ -n "$PHYSFS_INC" ]; then PHYSFS_INC="$(dirname "$PHYSFS_INC")"; fi
          GLEW_SO="$(find /usr -name 'libGLEW*.so*' 2>/dev/null | head -n1 || true)"
          GLEW_INC="$(find /usr -name 'GL/glew.h' 2>/dev/null | head -n1 || true)"
          if [ -n "$GLEW_INC" ]; then GLEW_INC="$(dirname "$GLEW_INC")"; fi

          echo "Found LIBZIP_SO: $LIBZIP_SO"
          echo "Found LIBZIP_INC: $LIBZIP_INC"
          echo "Found ZLIB_SO: $ZLIB_SO"
          echo "Found ZLIB_INC: $ZLIB_INC"
          echo "Found PHYSFS_SO: $PHYSFS_SO"
          echo "Found PHYSFS_INC: $PHYSFS_INC"
          echo "Found GLEW_SO: $GLEW_SO"
          echo "Found GLEW_INC: $GLEW_INC"

          # Build configure flags only for non-empty variables
          CMAKE_FLAGS="-DCMAKE_EXPORT_COMPILE_COMMANDS=ON"
          [ -n "$LIBZIP_SO" ] && CMAKE_FLAGS="$CMAKE_FLAGS -DLIBZIP_LIBRARY=$LIBZIP_SO"
          [ -n "$LIBZIP_INC" ] && CMAKE_FLAGS="$CMAKE_FLAGS -DLIBZIP_INCLUDE_DIR=$LIBZIP_INC"
          [ -n "$ZLIB_SO" ] && CMAKE_FLAGS="$CMAKE_FLAGS -DZLIB_LIBRARY=$ZLIB_SO"
          [ -n "$ZLIB_INC" ] && CMAKE_FLAGS="$CMAKE_FLAGS -DZLIB_INCLUDE_DIR=$ZLIB_INC"
          [ -n "$PHYSFS_SO" ] && CMAKE_FLAGS="$CMAKE_FLAGS -DPHYSFS_LIBRARY=$PHYSFS_SO"
          [ -n "$PHYSFS_INC" ] && CMAKE_FLAGS="$CMAKE_FLAGS -DPHYSFS_INCLUDE_DIR=$PHYSFS_INC"
          [ -n "$GLEW_SO" ] && CMAKE_FLAGS="$CMAKE_FLAGS -DGLEW_LIBRARY=$GLEW_SO"
          [ -n "$GLEW_INC" ] && CMAKE_FLAGS="$CMAKE_FLAGS -DGLEW_INCLUDE_DIR=$GLEW_INC"

          echo "CMAKE_FLAGS: $CMAKE_FLAGS"

          # Run CMake configure in build directory
          cmake -S . -B build $CMAKE_FLAGS || true

          # If compile_commands.json produced, copy to tmp for downstream scripts
          if [ -f build/compile_commands.json ]; then
            mkdir -p tmp
            cp build/compile_commands.json tmp/ || true
            echo "Copied build/compile_commands.json -> tmp/compile_commands.json"
          else
            echo "No compile_commands.json generated"
          fi

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Run full extract orchestrator
        env:
          LIBCLANG_VERSION: ${{ env.LIBCLANG_VERSION }}
        run: ./scripts/run-extract-full.sh --install-deps --regression-threshold 0

      - name: Generate short summary
        if: always()
        run: |
          mkdir -p tmp
          REPORT="tmp/extract_report.txt"
          OUT="tmp/full-extract-summary.md"
          if [ -f "$REPORT" ]; then
            TIMESTAMP="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            PERCENT="$(grep -i 'Percent delta' "$REPORT" | sed -E 's/[^0-9.-]*([0-9.]+).*/\1/' || true)"
            BASELINE="$(grep -i 'Baseline count' "$REPORT" | sed -E 's/[^0-9]*([0-9]+).*/\1/' || true)"
            NEW="$(grep -i 'New count' "$REPORT" | sed -E 's/[^0-9]*([0-9]+).*/\1/' || true)"
            REGRESSION="$(grep -i 'REGRESSION' "$REPORT" || true)"
            {
              printf -- "# Full Extract Summary\n"
              printf -- "- generated_at: %s (UTC)\n" "$TIMESTAMP"
              printf -- "- baseline_count: %s\n" "${BASELINE:-N/A}"
              printf -- "- new_count: %s\n" "${NEW:-N/A}"
              printf -- "- percent_delta: %s\n" "${PERCENT:-N/A}"
              if [ -n "$REGRESSION" ]; then
                printf -- "- conclusion: REGRESSION\n"
              else
                printf -- "- conclusion: OK\n"
              fi
              printf -- "\n"
              printf -- "## Short extract of report\n"
              sed -n '1,50p' "$REPORT"
            } > "$OUT"
          else
            printf -- "No report found to summarize\n" > tmp/full-extract-summary.md
          fi

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-extract-logs-${{ github.run_id }}
          path: tmp/**
