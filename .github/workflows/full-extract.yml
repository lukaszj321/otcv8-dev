name: Full extractor

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  pull_request:
    types: [labeled]

env:
  LIBCLANG_VERSION: 14
  NPM_CONFIG_LEGACY_PEER_DEPS: "true"

jobs:
  full-extract:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Add LLVM apt repo (pin libclang) with fallback to jammy
        run: |
          set -euo pipefail
          printf -- "LIBCLANG_VERSION=%s\n" "${LIBCLANG_VERSION}"
          sudo apt-get update -y
          sudo apt-get install -y wget gnupg lsb-release ca-certificates || true

          CODENAME="$(lsb_release -cs || echo unknown)"
          printf -- "Detected distro codename: %s\n" "$CODENAME"

          if curl -sfI "https://apt.llvm.org/dists/${CODENAME}/" >/dev/null 2>&1; then
            printf -- "apt.llvm.org supports %s; using llvm.sh installer for %s\n" "$CODENAME" "${LIBCLANG_VERSION}"
            curl -sSL https://apt.llvm.org/llvm.sh | sudo bash -s -- "${LIBCLANG_VERSION}" || true
            sudo apt-get update -y || true
          else
            printf -- "apt.llvm.org does NOT support %s; falling back to jammy (22.04) packages\n" "$CODENAME"
            wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmour -o /usr/share/keyrings/llvm-archive-keyring.gpg || true
            printf -- "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-14 main\n" | sudo tee /etc/apt/sources.list.d/llvm.list
            sudo apt-get update -y || true
          fi

      - name: Install system dependencies (including Boost)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libzip-dev libbz2-dev
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            "libclang-${LIBCLANG_VERSION}-dev" \
            "llvm-${LIBCLANG_VERSION}" \
            cmake python3 python3-venv python3-pip build-essential jq pkg-config \
            libboost-dev libboost-system-dev libboost-filesystem-dev || true

      - name: Create Python venv & install deps
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Install npm deps (tree-sitter) with legacy peer deps
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: ${{ env.NPM_CONFIG_LEGACY_PEER_DEPS }}
        run: |
          npm ci --no-audit --no-fund || npm install --legacy-peer-deps || true

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Run full extract orchestrator
        env:
          LIBCLANG_VERSION: ${{ env.LIBCLANG_VERSION }}
        run: ./scripts/run-extract-full.sh --install-deps --regression-threshold 0

      - name: Generate full extract summary
        run: |
          mkdir -p tmp
          REPORT="tmp/extract_report.txt"
          OUT="tmp/full-extract-summary.md"

          if [ -f "$REPORT" ]; then
            TIMESTAMP="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            PERCENT="$(grep -i 'Percent delta' "$REPORT" | sed -E 's/[^0-9.-]*([0-9.]+).*/\1/' || true)"
            BASELINE="$(grep -i 'Baseline count' "$REPORT" | sed -E 's/[^0-9]*([0-9]+).*/\1/' || true)"
            NEW="$(grep -i 'New count' "$REPORT" | sed -E 's/[^0-9]*([0-9]+).*/\1/' || true)"
            REGRESSION="$(grep -i 'REGRESSION' "$REPORT" || true)"

            {
              printf "# Full Extract Summary\n"
              printf -- "- generated_at: %s (UTC)\n" "$TIMESTAMP"
              printf -- "- baseline_count: %s\n" "${BASELINE:-N/A}"
              printf -- "- new_count: %s\n" "${NEW:-N/A}"
              printf -- "- percent_delta: %s\n" "${PERCENT:-N/A}"
              if [ -n "$REGRESSION" ]; then
                printf -- "- conclusion: REGRESSION\n"
              else
                printf -- "- conclusion: OK\n"
              fi
              printf "\n"
              printf "## Short extract of report\n"
              sed -n '1,50p' "$REPORT"
            } > "$OUT"
          else
            printf "No report found to summarize\n" > "$OUT"
          fi

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-extract-logs-${{ github.run_id }}
          path: tmp/**
