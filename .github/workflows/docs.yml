name: docs

on:
  push:
    branches: [ master ]
    paths:
      - "docs/**"
      - "src/**"
      - "Doxyfile"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  SPHINX_JOBS: "auto"
  SPHINX_HTML_BASEURL: "https://lukaszj321.github.io/otcv8-dev"
  SPHINX_MERMAID_VERSION: "10.9.1"
  SPHINX_MERMAID_OUT: "raw"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install APT deps (Doxygen + Graphviz)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen graphviz fonts-dejavu-core

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f docs/requirements.txt ]; then pip install -r docs/requirements.txt; fi
          pip install \
            "sphinx>=7.2" \
            pydata-sphinx-theme>=0.15 \
            myst-nb>=1.0 \
            sphinxcontrib-mermaid>=0.9 \
            sphinx-design>=0.6.1 \
            breathe>=4.35.0 \
            exhale>=0.3.7 \
            sphinx-copybutton \
            sphinxext-opengraph \
            "sphinx-sitemap>=2.6.0" \
            sphinx-favicon \
            "sphinx-codeautolink>=0.15.0" \
            "hoverxref>=1.4.2,<1.5" \
            sphinx-last-updated-by-git \
            sphinxext-rediraffe \
            sphinxcontrib-bibtex \
            sphinxcontrib-jquery

      - name: Ensure Sphinx dirs
        run: |
          mkdir -p docs/_static docs/_templates docs/_build/html

      - name: Run Doxygen (if Doxyfile exists)
        run: |
          if [ -f Doxyfile ]; then
            mkdir -p docs/_build/doxygen/xml
            doxygen Doxyfile
            test -f docs/_build/doxygen/xml/index.xml && echo "✓ Doxygen XML ready"
          else
            echo "No Doxyfile found — skipping Doxygen."
          fi

      # Uproszczony fallback index (jeśli nie masz index.rst/md w repo)
      - name: Create fallback index.md (only if missing)
        run: |
          if [ ! -f docs/index.rst ] && [ ! -f docs/index.md ]; then
            printf '%s' "# OTClient v8 — Developer Documentation

```"{toctree}""
:maxdepth: 2
:caption: Spis treści
:hidden:

guide/index
authoring/index
copilot/sphinx/index
```" > docs/index.md
            echo "[index-fallback] created docs/index.md"
          fi

      - name: Build docs (HTML)
        env:
          GITHUB_PAGES: "true"
        run: |
          set -euo pipefail
          sphinx-build -b html -j "${SPHINX_JOBS:-auto}" docs docs/_build/html \
            -D mermaid_output_format=${SPHINX_MERMAID_OUT} \
            -D mermaid_version=${SPHINX_MERMAID_VERSION} \
            -D html_baseurl="${SPHINX_HTML_BASEURL}"
          touch docs/_build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
