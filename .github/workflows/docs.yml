name: docs

on:
  push:
    branches: [ master ]
    paths:
      - "docs/**"
      - "src/**"
      - "Doxyfile"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: "docs-pages"
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  SPHINX_JOBS: "auto"
  SPHINX_HTML_BASEURL: "https://lukaszj321.github.io/otcv8-dev"
  SPHINX_MERMAID_VERSION: "10.9.1"
  SPHINX_MERMAID_OUT: "raw"
  GITHUB_PAGES: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            docs/requirements.txt

      - name: Install system deps (doxygen, graphviz)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen graphviz fonts-dejavu-core

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r docs/requirements.txt

      - name: Create fallback index.md if missing
        shell: bash
        run: |
          if [ ! -f docs/index.rst ] && [ ! -f docs/index.md ]; then
            mkdir -p docs
            cat > docs/index.md <<EOF
---
title: OTClient v8 — Developer Documentation
---

# OTClient v8 — Developer Documentation

```{toctree}
:maxdepth: 2
:caption: Spis treści
:hidden:

guide/index
authoring/index
copilot/sphinx/index
            echo "[index-fallback] created docs/index.md"
          fi

      - name: Build Sphinx (HTML)
        run: |
          sphinx-build -E -a -j "${SPHINX_JOBS:-auto}" -b html docs docs/_build/html \
            -D mermaid_output_format="${SPHINX_MERMAID_OUT}" \
            -D mermaid_version="${SPHINX_MERMAID_VERSION}" \
            -D html_baseurl="${SPHINX_HTML_BASEURL}"
          touch docs/_build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
