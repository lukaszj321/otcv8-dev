name: docs

on:
  push:
    branches: [ master ]
    paths:
      - "docs/**"
      - "src/**"
      - "Doxyfile"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: "docs-pages"
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  SPHINX_JOBS: "auto"
  SPHINX_HTML_BASEURL: "https://lukaszj321.github.io/otcv8-dev"
  SPHINX_MERMAID_VERSION: "10.9.1"
  SPHINX_MERMAID_OUT: "raw"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout (full history for git timestamps)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure docs dirs exist
        run: |
          mkdir -p docs/_static docs/_templates docs/_extra
          mkdir -p docs/_build/doxygen/xml

      - name: Detect config/theme changes (for full rebuild)
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            conf:
              - 'docs/conf.py'
              - 'docs/_templates/**'
              - 'docs/_static/**'
              - 'docs/copilot/sphinx/conf_copilot_snippet.py'

      - name: Setup Python (3.11) + pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            docs/requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f docs/requirements.txt ]; then pip install -r docs/requirements.txt; fi
          # Bezpiecznik: dociągnij krytyczne rozszerzenia jeśli nie ma
          python - << 'PY'
          import sys, subprocess, importlib
          def ensure(pkg, mod=None):
              mod = mod or pkg.split("==")[0].split(">=")[0].replace("-", "_")
              try:
                  importlib.import_module(mod)
              except Exception:
                  subprocess.check_call([sys.executable, "-m", "pip", "install", pkg])
          for p in [
              "breathe>=4.35.0",
              "exhale>=0.3.7",
              "sphinx-design>=0.6.1",
              "sphinxcontrib-mermaid",
              "pydata-sphinx-theme",
          ]:
              ensure(p)
          PY

      - name: Cache Doxygen XML
        id: cache_doxygen
        uses: actions/cache@v4
        with:
          path: docs/_build/doxygen/xml
          key: doxygen-${{ runner.os }}-${{ hashFiles('Doxyfile', 'src/**/*.h', 'src/**/*.hpp', 'src/**/*.hh', 'src/**/*.cpp', 'src/**/*.cc') }}

      - name: Install Doxygen + Graphviz (if cache miss)
        if: steps.cache_doxygen.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen graphviz fonts-dejavu-core

      - name: Run Doxygen (if cache miss)
        if: steps.cache_doxygen.outputs.cache-hit != 'true'
        run: |
          doxygen Doxyfile
          test -f docs/_build/doxygen/xml/index.xml && echo "✓ Doxygen XML ready"

      - name: Cache Sphinx artifacts
        id: cache_sphinx
        uses: actions/cache@v4
        with:
          path: |
            docs/_build/.doctrees
            docs/_build/.jupyter_cache
          key: sphinx-${{ runner.os }}-${{ hashFiles('docs/conf.py', 'docs/**/*.md', 'docs/**/*.rst', 'docs/**/*.ipynb', 'docs/_static/**', 'docs/_templates/**', 'docs/copilot/sphinx/conf_copilot_snippet.py') }}

      - name: Sanityzuj CSV (ucieczka | oraz końcowych _)
        run: |
          python - << 'PY'
          import re, pathlib
          base = pathlib.Path("docs/copilot/csv")
          if base.exists():
              for p in base.glob("*.csv"):
                  txt = p.read_text(encoding="utf-8")
                  # 1) ucieczka rurek, by nie powstało |substitution|
                  txt = txt.replace("|", r"\|")
                  # 2) ucieczka podkreślenia na końcu tokenu: 'rep_' -> 'rep\_'
                  txt = re.sub(r'(?<=\w)_(?=\W|$)', r'\\_', txt)
                  p.write_text(txt, encoding="utf-8")
                  print(f"[csv-fix] sanitized {p}")
          PY

      - name: Build docs (HTML)
        env:
          FULL_REBUILD: ${{ steps.changes.outputs.conf }}
        run: |
          set -euo pipefail
          EXTRA_OPTS=""
          if [ "${FULL_REBUILD}" = "true" ]; then
            EXTRA_OPTS="-E -a"
          fi
          sphinx-build -b html -j "${SPHINX_JOBS:-auto}" $EXTRA_OPTS docs docs/_build/html \
            -D mermaid_output_format="${SPHINX_MERMAID_OUT}" -D mermaid_version="${SPHINX_MERMAID_VERSION}" \
            -D html_baseurl="${SPHINX_HTML_BASEURL}"
          touch docs/_build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
