name: docs

on:
  push:
    branches: [ master ]
    paths:
      - "docs/**"
      - "src/**"
      - "Doxyfile"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-pages
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  SPHINX_JOBS: "auto"
  SPHINX_HTML_BASEURL: "https://lukaszj321.github.io/otcv8-dev"
  SPHINX_MERMAID_VERSION: "10.9.1"
  SPHINX_MERMAID_OUT: "raw"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect config/theme changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            conf:
              - 'docs/conf.py'
              - 'docs/_templates/**'
              - 'docs/_static/**'

      - name: Setup Python (with pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            docs/requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f docs/requirements.txt ]; then pip install -r docs/requirements.txt; fi
          # najważniejsze rozszerzenia wprost (bez heredoców)
          pip install \
            pydata-sphinx-theme>=0.15 \
            myst-nb>=1.0 \
            sphinxcontrib-mermaid>=0.9 \
            sphinx-design>=0.6.1 \
            breathe>=4.35.0 \
            exhale>=0.3.7 \
            sphinx-copybutton \
            sphinxext-opengraph \
            sphinx-sitemap>=2.6.0 \
            sphinx-favicon \
            sphinx-codeautolink>=0.15.0 \
            "hoverxref>=1.4.2,<1.5" \
            sphinx-last-updated-by-git \
            sphinxext-rediraffe \
            sphinxcontrib-bibtex \
            sphinxcontrib-jquery

      - name: Cache Doxygen XML
        id: cache_doxygen
        uses: actions/cache@v4
        with:
          path: docs/_build/doxygen/xml
          key: doxygen-${{ runner.os }}-${{ hashFiles('Doxyfile', 'src/**/*.h', 'src/**/*.hpp', 'src/**/*.hh', 'src/**/*.cpp', 'src/**/*.cc') }}

      - name: Install Doxygen + Graphviz (if needed)
        if: steps.cache_doxygen.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen graphviz fonts-dejavu-core

      - name: Prepare Doxygen dirs
        if: steps.cache_doxygen.outputs.cache-hit != 'true'
        run: mkdir -p docs/_build/doxygen/xml

      - name: Run Doxygen (if cache miss)
        if: steps.cache_doxygen.outputs.cache-hit != 'true'
        run: |
          doxygen Doxyfile
          test -f docs/_build/doxygen/xml/index.xml && echo "✓ Doxygen XML ready"

      - name: Ensure Sphinx dirs exist
        run: mkdir -p docs/_static docs/_templates docs/_build/.jupyter_cache docs/_build/.doctrees

      - name: Create fallback index.md (only if missing)
        run: |
          if [ ! -f docs/index.rst ] && [ ! -f docs/index.md ]; then
            printf '%s\n' \
'---' \
'title: OTClient v8 — Developer Documentation' \
'---' \
'' \
'# OTClient v8 — Developer Documentation' \
'' \
'```{toctree}' \
':maxdepth: 2' \
':caption: Spis treści' \
':hidden:' \
'' \
'guide/index' \
'authoring/index' \
'copilot/sphinx/index' \
'```' \
> docs/index.md
            echo "[index-fallback] created docs/index.md"
          fi

      - name: Cache Sphinx artifacts
        id: cache_sphinx
        uses: actions/cache@v4
        with:
          path: |
            docs/_build/.doctrees
            docs/_build/.jupyter_cache
          key: sphinx-${{ runner.os }}-${{ hashFiles('docs/conf.py', 'docs/**/*.md', 'docs/**/*.rst', 'docs/**/*.ipynb', 'docs/_static/**', 'docs/_templates/**') }}

      - name: Build docs (HTML)
        env:
          FULL_REBUILD: ${{ steps.changes.outputs.conf }}
          GITHUB_PAGES: "true"
        run: |
          set -euo pipefail
          EXTRA_OPTS=""
          if [ "${FULL_REBUILD}" = "true" ]; then
            EXTRA_OPTS="-E -a"
          fi
          sphinx-build -b html -j "${SPHINX_JOBS:-auto}" $EXTRA_OPTS docs docs/_build/html \
            -D mermaid_output_format=${SPHINX_MERMAID_OUT} \
            -D mermaid_version=${SPHINX_MERMAID_VERSION} \
            -D html_baseurl="${SPHINX_HTML_BASEURL}"
          touch docs/_build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
