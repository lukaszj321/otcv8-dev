name: docs
on:
  push:
    branches: [ master ]
    paths:
      - "docs/**"
      - "api/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # Install docs dependencies (contains all required packages)
          pip install -r docs/requirements.txt
          # Verify CRITICAL packages for Mermaid rendering
          python - << 'PY'
          import sys
          try:
              import sphinxcontrib.mermaid
              print("✓ sphinxcontrib-mermaid installed:", sphinxcontrib.mermaid.__version__ if hasattr(sphinxcontrib.mermaid, '__version__') else 'unknown')
          except ImportError as e:
              print("✗ CRITICAL: sphinxcontrib-mermaid not installed:", e)
              sys.exit(1)
          
          try:
              import myst_nb
              print("✓ myst-nb installed:", myst_nb.__version__ if hasattr(myst_nb, '__version__') else 'unknown')
          except ImportError as e:
              print("✗ CRITICAL: myst-nb not installed:", e)
              sys.exit(1)
          
          try:
              import sphinx_design
              print("✓ sphinx-design installed:", sphinx_design.__version__ if hasattr(sphinx_design, '__version__') else 'unknown')
          except ImportError as e:
              print("✗ CRITICAL: sphinx-design not installed:", e)
              sys.exit(1)
          
          print("\n✓ All critical packages verified successfully")
          PY

      - name: Run content hygiene fixers
        run: |
          echo "=== Running Content Hygiene Tools ==="
          python3 docs/authoring/_tools/mermaid_force_directive.py || true
          python3 docs/authoring/_tools/mermaid_unescape_fix.py || true
          python3 docs/authoring/_tools/myst_dedent_fix.py || true
          python3 docs/authoring/_tools/frontmatter_fix.py || true
          python3 docs/authoring/_tools/mermaid_lint_fix.py || true
          ./docs/authoring/_tools/qa_rerun.sh || true

      - name: Build docs
        run: |
          python scripts/build_authoring_pages.py || true
          if [ -f scripts/patch_diagrams_clicks.py ]; then python scripts/patch_diagrams_clicks.py; fi
          sphinx-build -b html docs docs/_build/html

      - name: Verify Mermaid rendering
        run: |
          echo "=== Verifying Mermaid Rendering ==="
          python3 docs/authoring/_tools/verify_mermaid_rendering.py || echo "⚠ Verification found issues"

      - name: Generate LIVE proofs
        run: |
          echo "=== Generating LIVE Proofs ==="
          python3 docs/authoring/_tools/generate_live_proofs.py

      - name: Upload pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
