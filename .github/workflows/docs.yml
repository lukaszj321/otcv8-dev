name: docs
on:
  push:
    branches: [ master ]
    paths:
      - "docs/**"
      - "api/**"
      - "src/**"
      - ".github/workflows/docs.yml"
      - "Doxyfile"
  workflow_dispatch:

env:
  SPHINX_TOLERATE_ERRORS: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (Doxygen + Graphviz)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen graphviz fonts-dejavu-core

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f docs/requirements.txt ]; then pip install -r docs/requirements.txt; fi
          python - << 'PY'
          import sys, subprocess
          def ensure(pkg):
              try:
                  __import__(pkg.split("==")[0].split(">=")[0].replace("-", "_"))
              except Exception:
                  subprocess.check_call([sys.executable, "-m", "pip", "install", pkg])
          for p in [
              "Sphinx>=7.0",
              "pydata-sphinx-theme>=0.16.1",
              "myst-nb>=1.0.0",
              "sphinxcontrib-mermaid",
              "sphinx-design>=0.6.1",
              "breathe>=4.35.0",
              "exhale>=0.3.7",
          ]:
              ensure(p)
          print("✓ Python deps ready")
          PY

      - name: Prepare Doxygen output dirs
        run: |
          mkdir -p docs/_build/doxygen/docs docs/_build/doxygen/xml

      - name: Run Doxygen
        run: |
          doxygen Doxyfile
          test -f docs/_build/doxygen/xml/index.xml && echo "✓ Doxygen XML ready"

      - name: Generate auto TOCs (indexes)
        run: |
          python docs/_tools/gen_auto_toc.py docs/copilot/sphinx/code docs/autoapi || true

      - name: Build Sphinx (HTML)
        run: |
          if [ "${{ env.SPHINX_TOLERATE_ERRORS }}" = "1" ]; then
            sphinx-build -E -a -b html docs docs/_build/html || true
          else
            sphinx-build -E -a -b html docs docs/_build/html
          fi
          touch docs/_build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
