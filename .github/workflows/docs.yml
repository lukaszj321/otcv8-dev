name: docs

on:
  push:
    branches: [ master ]
    paths:
      - "docs/**"
      - "src/**"
      - "Doxyfile"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "src/**"
      - "Doxyfile"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-pages
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  SPHINX_JOBS: "auto"
  SPHINX_HTML_BASEURL: "https://lukaszj321.github.io/otcv8-dev"
  SPHINX_MERMAID_VERSION: "10.9.1"
  SPHINX_MERMAID_OUT: "raw"
  GITHUB_PAGES: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect config/theme changes (full rebuild trigger)
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            conf:
              - 'docs/conf.py'
              - 'docs/_templates/**'
              - 'docs/_static/**'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install system deps (doxygen, graphviz)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen graphviz fonts-dejavu-core

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r docs/requirements.txt

      # ---------- DOXYGEN CACHE ----------
      - name: Cache Doxygen XML
        id: cache_doxygen
        uses: actions/cache@v4
        with:
          path: docs/_build/doxygen/xml
          key: doxygen-${{ runner.os }}-${{ hashFiles('Doxyfile', 'src/**') }}

      - name: Prepare Doxygen dirs
        if: steps.cache_doxygen.outputs.cache-hit != 'true'
        run: |
          mkdir -p docs/_build/doxygen/xml

      - name: Run Doxygen (only if cache miss)
        if: steps.cache_doxygen.outputs.cache-hit != 'true'
        run: |
          doxygen Doxyfile
          test -f docs/_build/doxygen/xml/index.xml && echo "✓ Doxygen XML ready"

      # ---------- SPHINX CACHE ----------
      - name: Cache Sphinx artifacts (doctrees/jupyter)
        id: cache_sphinx
        uses: actions/cache@v4
        with:
          path: |
            docs/_build/.doctrees
            docs/_build/doctrees
            docs/_build/.jupyter_cache
          key: sphinx-${{ runner.os }}-${{ hashFiles('docs/conf.py', 'docs/**/*.md', 'docs/**/*.rst', 'docs/**/*.ipynb', 'docs/_static/**', 'docs/_templates/**') }}

      # ---------- FALLBACK INDEX ----------
      - name: Create fallback docs/index.md if missing
        shell: bash
        run: |
          if [ ! -f docs/index.rst ] && [ ! -f docs/index.md ]; then
            mkdir -p docs
            {
              echo '---'
              echo 'title: OTClient v8 — Developer Documentation'
              echo '---'
              echo
              echo '# OTClient v8 — Developer Documentation'
              echo
              echo '```{toctree}'
              echo ':maxdepth: 2'
              echo ':caption: Spis treści'
              echo ':hidden:'
              echo
              echo 'guide/index'
              echo 'authoring/index'
              echo 'copilot/sphinx/index'
              echo '```'
            } > docs/index.md
            echo "[index-fallback] created docs/index.md"
          fi

      # ---------- BUILD ----------
      - name: Build Sphinx (HTML)
        env:
          FULL_REBUILD: ${{ steps.changes.outputs.conf }}
        run: |
          EXTRA_OPTS=""
          if [ "${FULL_REBUILD}" = "true" ]; then
            EXTRA_OPTS="-E -a"
            echo "[build] Full rebuild forced (conf/templates/static changed)"
          else
            echo "[build] Incremental build (using doctrees cache)"
          fi
          sphinx-build -b html -j "${SPHINX_JOBS:-auto}" $EXTRA_OPTS docs docs/_build/html \
            -D mermaid_output_format="${SPHINX_MERMAID_OUT}" \
            -D mermaid_version="${SPHINX_MERMAID_VERSION}" \
            -D html_baseurl="${SPHINX_HTML_BASEURL}"
          touch docs/_build/html/.nojekyll

      # ---------- SCREENSHOTS ----------
      - name: Install Chromium for screenshots
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends chromium-browser

      - name: Generate screenshots
        run: |
          mkdir -p docs/_build/html/screenshots
          # Find all index.html files up to depth 3
          find docs/_build/html -maxdepth 3 -name "index.html" -type f | while read html_file; do
            # Get relative path from docs/_build/html
            rel_path="${html_file#docs/_build/html/}"
            # Create screenshot filename (replace / with _ and remove .html)
            screenshot_name=$(echo "$rel_path" | sed 's/\//_/g' | sed 's/.html$//')
            screenshot_path="docs/_build/html/screenshots/${screenshot_name}.png"
            echo "📸 Generating screenshot: $screenshot_path from $html_file"
            # Generate screenshot with chromium headless
            chromium-browser --headless --disable-gpu --screenshot="$screenshot_path" \
              --window-size=1920,1080 --virtual-time-budget=10000 \
              "file://${PWD}/${html_file}" 2>/dev/null || true
          done
          echo "✓ Generated $(ls -1 docs/_build/html/screenshots/*.png 2>/dev/null | wc -l) screenshots"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
