name: docs

on:
  push:
    branches: [ master ]
    paths:
      - "docs/**"
      - "src/**"
      - "Doxyfile"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-pages
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  SPHINX_JOBS: "auto"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark repo as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Detect config/theme changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            conf:
              - 'docs/conf.py'
              - 'docs/_templates/**'
              - 'docs/_static/**'

      - name: Setup Python (+cache pip)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            docs/requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f docs/requirements.txt ]; then pip install -r docs/requirements.txt; fi
          python - << 'PY'
          import sys, subprocess
          def ensure(pkg):
              try:
                  __import__(pkg.split("==")[0].split(">=")[0].replace("-", "_"))
              except Exception:
                  subprocess.check_call([sys.executable, "-m", "pip", "install", pkg])
          for p in ["breathe>=4.35.0", "exhale>=0.3.7", "sphinxcontrib-mermaid", "sphinx-design>=0.6.1"]:
              ensure(p)
          PY

# --- FIX dla 'diagrams': rozwiń katalog na pliki, bez omijania
      - name: Patch copilot snippet (expand dir deps)
        run: |
          set -e
          SNIP="docs/copilot/sphinx/conf_copilot_snippet.py"
          if [ -f "$SNIP" ]; then
            # Store the Python patch in a shell variable to avoid YAML syntax confusion
            PY_PATCH=$(cat <<'EOF'
# --- CI patch: expand directory dependencies to files (fix for sphinx-last-updated-by-git)
try:
    import os
    def _ci_expand_dir_deps(app, env):
        base = os.path.join(env.srcdir, "copilot", "diagrams")
        if os.path.isdir(base):
            for root, _, files in os.walk(base):
                for fname in files:
                    rel = os.path.relpath(os.path.join(root, fname), env.srcdir)
                    try:
                        env.note_dependency(rel)
                    except Exception:
                        pass
    try:
        _old_setup = setup   # type: ignore # noqa
    except NameError:
        def _old_setup(app):  # type: ignore
            return
    def setup(app):  # type: ignore
        _old_setup(app)
        app.connect("env-before-read-docs", _ci_expand_dir_deps)
except Exception:
    pass
EOF
)
            # Append the patch from the variable to the target file
            echo "$PY_PATCH" >> "$SNIP"
            echo "Patched $SNIP"
          else
            echo "No copilot snippet found, skipping patch."
          fi

      - name: Warn if diagrams not tracked
        run: |
          if [ -d docs/copilot/diagrams ]; then
            if ! git ls-files --error-unmatch docs/copilot/diagrams >/dev/null 2>&1; then
              echo "::warning ::'docs/copilot/diagrams' nie zawiera śledzonych plików. Dodaj i zacommituj pliki."
            fi
          fi

      - name: Cache Doxygen XML
        id: cache_doxygen
        uses: actions/cache@v4
        with:
          path: docs/_build/doxygen/xml
          key: doxygen-${{ runner.os }}-${{ hashFiles('Doxyfile', 'src/**/*.h', 'src/**/*.hpp', 'src/**/*.hh', 'src/**/*.cpp', 'src/**/*.cc') }}

      - name: Install Doxygen + Graphviz (only if needed)
        if: steps.cache_doxygen.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen graphviz fonts-dejavu-core

      - name: Prepare Doxygen dirs
        if: steps.cache_doxygen.outputs.cache-hit != 'true'
        run: mkdir -p docs/_build/doxygen/xml

      - name: Run Doxygen (only if cache miss)
        if: steps.cache_doxygen.outputs.cache-hit != 'true'
        run: |
          doxygen Doxyfile
          test -f docs/_build/doxygen/xml/index.xml && echo "✓ Doxygen XML ready"

      - name: Cache Sphinx artifacts
        id: cache_sphinx
        uses: actions/cache@v4
        with:
          path: |
            docs/_build/.doctrees
            docs/_build/.jupyter_cache
          key: sphinx-${{ runner.os }}-${{ hashFiles('docs/conf.py', 'docs/**/*.md', 'docs/**/*.rst', 'docs/**/*.ipynb', 'docs/_static/**', 'docs/_templates/**') }}

      - name: Generate auto TOCs (indexes)
        run: |
          if [ -f docs/_tools/gen_auto_toc.py ]; then
            python docs/_tools/gen_auto_toc.py docs/copilot/sphinx/code docs/autoapi || true
          fi

      - name: Build docs (HTML)
        env:
          FULL_REBUILD: ${{ steps.changes.outputs.conf }}
        run: |
          set -euo pipefail
          EXTRA_OPTS=""
          if [ "${FULL_REBUILD}" = "true" ]; then
            EXTRA_OPTS="-E -a"
          fi
          sphinx-build -b html -j "${SPHINX_JOBS:-auto}" $EXTRA_OPTS docs docs/_build/html \
            -D mermaid_output_format=raw -D mermaid_version=10.9.1 \
            -D html_baseurl="https://lukaszj321.github.io/otcv8-dev"
          touch docs/_build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
